source_systems:
  - id: SYS_DOTOOL
    name: DO / Digital Orders
    code: DOTOOL
    type: Application
    description: Order fulfillment/activation tool referenced constantly across tickets ("failing in DO", "DO tool").
    owning_team: DPO Order Management (DO)
    owning_team_id: TEAM_DPO_OMD
    environment: NPE
  - id: SYS_RSP
    name: RSP (Real-time Service Provisioning)
    code: RSP
    type: Application
    description: Backend provisioning/activation system, frequently named in errorSystem fields.
    owning_team: DPO DICE
    owning_team_id: TEAM_DPO_DICE
    environment: NPE
  - id: SYS_SAP
    name: SAP (ERP / Fulfillment)
    code: SAP
    type: Application
    description: ERP/order-fulfillment backend, referenced via SAP order ids and TARGET_SYSTEM=SAPPIREST.
    owning_team: TBD
    environment: NPE
  - id: SYS_TPAS
    name: TPAS (Account/Line Provisioning API)
    code: TPAS
    type: Application
    description: Account/line provisioning API (v2/v3), tpas-reference-ui and tpasdo hostnames.
    owning_team: TBD
    environment: NPE
  - id: SYS_ESIACCT
    name: ESI Account Management
    code: ESIACCT
    type: Application
    description: SOAP-based account management (BAN creation, service agreements).
    owning_team: DPO DICE
    owning_team_id: TEAM_DPO_DICE
    environment: NPE
  - id: SYS_CAMS
    name: DSG-CAMS (Customer Account Mgmt Service)
    code: CAMS
    type: Application
    description: Customer account management service, named directly in tickets ("DSG-CAMS").
    owning_team: DPO DICE
    owning_team_id: TEAM_DPO_DICE
    environment: NPE
  - id: SYS_DICE
    name: DICE / DLM Device Lifecycle Events
    code: DICE
    type: Application
    description: Trade-in and warranty/disposition device-lifecycle event system (Deep.io events).
    owning_team: DPO DICE
    owning_team_id: TEAM_DPO_DICE
    environment: NPE
  - id: SYS_ATLAS
    name: ATLAS (Care/Dealer platform)
    code: ATLAS
    type: Application
    description: Care/dealer front-end platform used to initiate DLM warranty and account flows.
    owning_team: DPO DICE
    owning_team_id: TEAM_DPO_DICE
    environment: NPE
  - id: SYS_TCA
    name: TCA (dealer login tool)
    code: TCA
    type: Application
    description: Dealer-facing login tool referenced in store-bypass flows.
    owning_team: TBD
    environment: NPE
  - id: SYS_STIC
    name: STIC (Apple Activation Auth)
    code: STIC
    type: Application
    description: Apple STIC activation authentication flow (SticAuthenticateUser/SticFindParkedOrder).
    owning_team: DPO DICE
    owning_team_id: TEAM_DPO_DICE
    environment: NPE
  - id: SYS_REFDATA
    name: Reference Data / DCO-Q2O
    code: REFDATA
    type: Application
    description: Quote generation / reference data service (DCO URL generation, sync-quote).
    owning_team: TBD
    environment: NPE
  - id: SYS_WARRANTY
    name: Warranty Eligibility Service
    code: WARRANTY
    type: Application
    description: Device warranty eligibility rules API, invoked from ATLAS/DICE warranty flows.
    owning_team: DPO DICE
    owning_team_id: TEAM_DPO_DICE
    environment: NPE
  - id: SYS_QUATRO
    name: Quatro / QTO Gateway (T-Life BFF)
    code: QUATRO
    type: Application
    description: T-Life backend-for-frontend gateway routing to CXEDGE/CAMS/VASP.
    owning_team: TBD
    environment: NPE
  - id: SYS_TLIFE
    name: T-Life / Autopay
    code: TLIFE
    type: Application
    description: T-Life mobile app (project prefix TLA), Autopay 1.5 flows.
    owning_team: TBD
    environment: NPE
  - id: SYS_REBELLION
    name: Rebellion (Prepaid retail web/app)
    code: REBELLION
    type: Application
    description: Prepaid retail web/app, CHUB ID account-setup errors.
    owning_team: TBD
    environment: NPE
  - id: SYS_BOSS
    name: BOSS (Subsidy order system)
    code: BOSS
    type: Application
    description: Subsidy order login/submission system.
    owning_team: TBD
    environment: NPE
  - id: SYS_FIBER
    name: Fiber OSA/DCS
    code: FIBER
    type: Application
    description: Fiber order-submission/activation (dealer code validation).
    owning_team: TBD
    environment: NPE
  - id: SYS_HSI
    name: HSI Gateway Activation
    code: HSI
    type: Application
    description: HSI Gateway device activation flow.
    owning_team: TBD
    environment: NPE
  - id: SYS_IDS
    name: Integrated Data Store
    code: IDS
    type: DataPipeline
    description: IDS source views fed by DO events (CDW_IDW_DB_*.IDW_CORE_V.* tables).
    owning_team: DPO DICE
    owning_team_id: TEAM_DPO_DICE
    environment: NPE
  - id: SYS_TPRE
    name: TPre / Magenta Prepaid
    code: TPRE
    type: Application
    description: Prepaid web app (guest pay, BYOD charge creation).
    owning_team: TBD
    environment: NPE
  - id: SYS_DASH
    name: Care Dash AAL
    code: DASH
    type: Application
    description: Care Dash subscriber-lookup application.
    owning_team: TBD
    environment: NPE
  - id: SYS_TAX
    name: Taxation Service
    code: TAX
    type: Application
    description: Taxation quote/rest service, high-latency/failure reports.
    owning_team: TBD
    environment: NPE
  - id: SYS_NUMMGT
    name: Number/Score Management
    code: NUMMGT
    type: Application
    description: Number management and score-eligibility service.
    owning_team: TBD
    environment: NPE


    signal_type: hostname
    signal_pattern: "digital-qlab\\d+"
    priority: 1
    action: assign_to_DOTOOL
  - id: IMR_DOTOOL_KEYWORD
    source_system_id: SYS_DOTOOL
    category: "FUNCTIONAL DEFECT (QA/UAT)"

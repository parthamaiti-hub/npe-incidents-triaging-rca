# ============================================
# npe_real_source_systems.yaml
# Real catalog inferred from 39 production tickets.
#
# JUDGMENT CALL, FLAGGED FOR REVIEW: incident_mapping_rules.category has no
# real taxonomy signal in the source data at all. Nearly
# everything below defaults to "FUNCTIONAL DEFECT (QA/UAT)" (the tickets are
# overwhelmingly app/API functional failures); only IDS (table/view data
# issues) is assigned "DATA QUALITY / TEST DATA". This is a coarse first
# pass, not a considered categorization -- correct freely.
#
# owning_team_id is set only where a team was clearly/frequently addressed in
# the sample tickets (dpo-dice, dpo-omd); everything else is left unset
# (owning_team free-text stays "TBD").
# ============================================

teams:
  - id: TEAM_DPO_DICE
    name: DPO DICE
    teams_handle: dpo-dice
    aliases: "DPO-DICE,DPO DICE Team"

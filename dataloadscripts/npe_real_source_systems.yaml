    name: DPO Order Management (DO)
    teams_handle: dpo-omd
    aliases: "DO Team"
  - id: TEAM_DND
    name: DND
    teams_handle: DND
  - id: TEAM_TRIAGE_NPE
    name: DSG-Triage-NPE (generic)
    teams_handle: DSG-Triage-NPE
    aliases: "DSG-Triage-NPE Team"


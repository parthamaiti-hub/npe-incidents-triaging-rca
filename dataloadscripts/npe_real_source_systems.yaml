# Three real playbooks authored to exercise the in-process
# playbook executor + deterministic RCA synthesizer end-to-end (the E2E
# bugID-to-RCA script). check_type results are currently stubbed (see
# app/checks.py) -- no real Splunk/AppInsights/data-contract/CI-CD
# integrations exist yet. The remaining 20 real systems still have no
# playbook; that's expected, not a bug -- classification still resolves for
# them, RCA execution just reports "no playbook configured yet."
rca_playbooks:
  - id: RCA_HSI_FUNC
    source_system_id: SYS_HSI
    category: "FUNCTIONAL DEFECT (QA/UAT)"
    steps:
      - call: error_logs
        with:
          env: NPE
          app: HSI
          lookback_minutes: 240
      - call: recent_deployments
        with:
          env: NPE
          app: HSI
          lookback_minutes: 1440
      - call: apm_traces
        with:
          env: NPE
          app: HSI
          lookback_minutes: 240
          latency_threshold_ms: 2000
      - call: dependent_services_health
        with:
          env: NPE
          app: HSI
          dependencies:
            - SAP
            - DOTOOL

  - id: RCA_FIBER_FUNC
    source_system_id: SYS_FIBER
    category: "FUNCTIONAL DEFECT (QA/UAT)"
    steps:
      - call: error_logs
        with:
          env: NPE
          app: FIBER
          lookback_minutes: 240
      - call: recent_deployments
        with:
          env: NPE
          app: FIBER
          lookback_minutes: 1440
      - call: apm_traces
        with:
          env: NPE
          app: FIBER
          lookback_minutes: 240
          latency_threshold_ms: 2000
      - call: dependent_services_health
        with:
          env: NPE
          app: FIBER

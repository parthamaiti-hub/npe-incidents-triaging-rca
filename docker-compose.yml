services:
  mongo:
    # Single-node replica set, not a standalone mongod: multi-document
    # transactions (version publish/approve, correlation groups) need one.
    # The healthcheck initiates the set on first start, then reports it.
    image: mongo:8.0
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27018:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}).ok }\" | grep -q 1"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 5s

  chroma:
    # RAG vector corpora -- derived data, rebuildable from Mongo with
    # scripts/rebuild_vector_index.py. Pinned together with the
    # chromadb-client version in pyproject.toml; upgrade both at once.
    # Host port 8011 (not 8000/8010) to stay clear of other local stacks.
    image: chromadb/chroma:1.5.9
    ports:
      - "8011:8000"
    volumes:
      - chromadata:/data
    healthcheck:
      # The image has no curl/wget; bash's /dev/tcp is enough for a probe.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000 && printf \"GET /api/v2/heartbeat HTTP/1.0\r\n\r\n\" >&3 && grep -q heartbeat <&3'"]
      interval: 5s
      timeout: 5s
      retries: 12

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # incident triage -- POST /incidents/{jira_key}/retry already covers
  # visibility for local dev (localhost:15673, guest/guest).
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  opa:
    image: openpolicyagent/opa:latest
    command: ["run", "--server", "--addr", "0.0.0.0:8181", "/policies"]
    volumes:
      - ./opa/policies:/policies:ro
    ports:
      - "8182:8181"

  frontend:
    build: ./frontend
    ports:
      - "3001:3000"
    environment:
      BACKEND_URL: http://host.docker.internal:8421
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  mongodata:
  chromadata:
